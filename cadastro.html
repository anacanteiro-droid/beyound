<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Beyond</title>

    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="pagina">

        
        <img
            src="imagens/fundo sem logo.jpeg"
            class="fundo"
            alt="Fundo da página">

        
        <button
            class="voltar"
            type="button"
            aria-label="Voltar"><a href="index.html">

            <i class="fa-solid fa-chevron-left"></i>

        </button></a>


        
        <section class="cadastro">

            
            <img
                src="imagens/image lodo preta.jpeg"
                class="logo"
                alt="Beyond">


            
            <h2>
                Seu próximo <span>nível</span> começa aqui!
            </h2>


            
            <form class="formulario">


                
                <div class="campo">

                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        name="nome"
                        placeholder="Nome completo"
                        required>

                </div>


                
                <div class="campo">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="e-mail"
                        required>

                </div>


                
                <div class="campo">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="senha"
                        placeholder="Senha"
                        required>

                </div>


                <button
                    class="cadastrar"
                    type="submit"><a class="criar_conta" href="paginainicial.html">

                    Criar conta

                </button></a>
               

            </form>


           
            <div class="ou">

                <div></div>

                <span>ou</span>

                <div></div>

            </div>


            
            <button
                class="google"
                type="button"
                aria-label="Continuar com Google"><a class="G" href="contadogoogle.html">

                <span class="google-logo">
                    G
                </span>

            </button></a>

        </section>

    </main>

</body>

</html>
